# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (MSVC, ${{ matrix.preset }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [x64-windows-msvc-release]

    env:
      VCPKG_CACHE_PREFIX: vcpkg-windows-${{ matrix.preset }}-
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite

    steps:
    - uses: actions/checkout@v4

    # vcpkg builds the dependencies from source, which takes most of the job's time,
    # and stores each package in the binary cache as soon as it is built.
    # The cache is restored and saved in separate steps, so that it is saved even when
    # the job fails or is cancelled (each push cancels the previous run): otherwise
    # nothing is cached until a whole run succeeds. Cache entries can't be overwritten,
    # so each run that builds a new package saves a new entry, keyed by the run ID,
    # and the next run restores the most recent one.
    - name: Restore vcpkg binary cache
      id: restore-vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}\vcpkg-binary-cache
        key: ${{ env.VCPKG_CACHE_PREFIX }}${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**') }}-${{ github.run_id }}
        restore-keys: |
          ${{ env.VCPKG_CACHE_PREFIX }}${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**') }}-
          ${{ env.VCPKG_CACHE_PREFIX }}

    - name: Create vcpkg binary cache directory
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
        $count = (Get-ChildItem -Recurse -File "$env:VCPKG_DEFAULT_BINARY_CACHE" | Measure-Object).Count
        "VCPKG_CACHE_RESTORED_FILES=$count" >> $env:GITHUB_ENV

    - name: Set up MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up vcpkg
      # Use the runner's preinstalled vcpkg, the ports baseline comes from vcpkg-configuration.json.
      # This runs after the developer environment is set up, which may set VCPKG_ROOT
      # to the Visual Studio bundled vcpkg.
      shell: pwsh
      run: |
        "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

    - name: Configure CMake
      # Installs dependencies from vcpkg.json in manifest mode
      run: cmake --preset=${{ matrix.preset }}

    - name: Check for new vcpkg packages
      id: check-vcpkg-cache
      if: always() && steps.restore-vcpkg-cache.outcome == 'success'
      shell: pwsh
      run: |
        $count = (Get-ChildItem -Recurse -File "$env:VCPKG_DEFAULT_BINARY_CACHE" | Measure-Object).Count
        "changed=$($count -ne [int]$env:VCPKG_CACHE_RESTORED_FILES)" >> $env:GITHUB_OUTPUT

    - name: Save vcpkg binary cache
      if: always() && steps.check-vcpkg-cache.outputs.changed == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}\vcpkg-binary-cache
        key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}

    - name: Build
      run: cmake --build --preset=${{ matrix.preset }}

    - name: Test
      run: ctest --preset=${{ matrix.preset }}

    # upload-artifact needs every path under one directory, and VCPKG_ROOT (C:) isn't
    # under the workspace (D:): copy vcpkg's build logs into the workspace first
    - name: Collect vcpkg logs
      if: failure()
      shell: pwsh
      run: |
        $buildtrees = "$env:VCPKG_ROOT/buildtrees"
        if (Test-Path $buildtrees) {
          robocopy $buildtrees vcpkg-logs/buildtrees *.log /S /NFL /NDL /NJH /NJS /NP | Out-Null
        }
        exit 0

    - name: Upload vcpkg logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: vcpkg-logs-${{ matrix.preset }}
        path: |
          build/vcpkg-manifest-install.log
          build/vcpkg_installed/vcpkg/blds/**/*.log
          vcpkg-logs/**/*.log
        if-no-files-found: ignore

  build-linux:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: x64-linux-gcc-release }
          - { os: ubuntu-latest, preset: x64-linux-clang-release }
          # The release workflow's Linux build (.github/workflows/release.yml)
          - { os: ubuntu-22.04, preset: x64-linux-gcc-static-release }

    name: Linux (${{ matrix.os }}, ${{ matrix.preset }})

    steps:
    - uses: actions/checkout@v4

    # The -dev packages also have the static libraries the static preset links
    - name: Set up environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y pkg-config libncurses-dev libicu-dev libssl-dev libgtest-dev python3 tmux

    - name: Configure CMake
      run: cmake --preset=${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset=${{ matrix.preset }}

    - name: Test
      run: ctest --preset=${{ matrix.preset }} --output-on-failure
