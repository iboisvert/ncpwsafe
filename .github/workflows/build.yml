# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (MSVC, ${{ matrix.preset }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [x64-windows-msvc-release]

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite

    steps:
    - uses: actions/checkout@v4

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}\vcpkg-binary-cache
        key: vcpkg-${{ runner.os }}-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-x64-windows-static-md-

    - name: Create vcpkg binary cache directory
      shell: pwsh
      run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

    - name: Set up MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up vcpkg
      # Use the runner's preinstalled vcpkg, the ports baseline comes from vcpkg-configuration.json.
      # This runs after the developer environment is set up, which may set VCPKG_ROOT
      # to the Visual Studio bundled vcpkg.
      shell: pwsh
      run: |
        "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

    - name: Configure CMake
      # Installs dependencies from vcpkg.json in manifest mode
      run: cmake --preset=${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset=${{ matrix.preset }}

    - name: Test
      run: ctest --preset=${{ matrix.preset }}

    - name: Upload vcpkg logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: vcpkg-logs-${{ matrix.preset }}
        path: |
          build/vcpkg-manifest-install.log
          build/vcpkg_installed/vcpkg/blds/**/*.log
          ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
        if-no-files-found: ignore

  build-linux:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        preset: [x64-linux-gcc-release, x64-linux-clang-release]

    steps:
    - uses: actions/checkout@v3

    - name: Set up environment (ubuntu-latest)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libncurses-dev libicu-dev nettle-dev libgtest-dev python3 tmux

    - name: Configure CMake
      run: cmake --preset=${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset=${{ matrix.preset }}

    - name: Test
      run: ctest --preset=${{ matrix.preset }} --output-on-failure
